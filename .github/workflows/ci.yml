name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m pip install --quiet 'PyYAML>=6' pytest
      - run: python3 -m pytest tests -q
      - run: python3 -m py_compile src/addons_cli.py
